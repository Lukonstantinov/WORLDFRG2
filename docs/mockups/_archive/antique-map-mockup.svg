    <rect x="-20" y="-9" width="4" height="2" fill="#3c2c18"/><rect x="-8" y="-9" width="4" height="2" fill="#3c2c18"/><rect x="4" y="-9" width="4" height="2" fill="#3c2c18"/><rect x="16" y="-9" width="4" height="2" fill="#3c2c18"/>
    <rect x="-22" y="-15" width="8" height="15" fill="#e9dcb8" stroke="#3c2c18"/><rect x="14" y="-15" width="8" height="15" fill="#e9dcb8" stroke="#3c2c18"/>
