name: Release installer

# IMPROVEMENT_PLAN Phase 5 — the Windows installer testers download.
# Run it by hand (Actions tab → "Release installer" → Run workflow) to get the
# installer as a build artifact, or push a tag like `v0.1.0-beta` to also attach it
# to a DRAFT GitHub release, which you publish yourself once you have checked it.
# The installer is UNSIGNED: Windows SmartScreen will warn ("More info → Run anyway")
# until a code-signing certificate is added.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # attaching assets to the draft release

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows

      # Builds the frontend (beforeBuildCommand) then the NSIS installer (MSI dropped: WiX rejects "-beta" versions).
      - name: tauri build
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: WorldForge2-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
