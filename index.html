<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldForge 2</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #080c12; color: #c0d0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; }
      button { font-family: inherit; }
      button:hover:not(:disabled) { filter: brightness(1.15); }
      button:active:not(:disabled) { filter: brightness(0.95); }
      button:disabled { opacity: 0.45; cursor: not-allowed !important; }
      input[type="range"] { accent-color: #3a80c0; }
      input[type="number"], input[type="text"] { font-family: inherit; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e2e42; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #2a4060; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
