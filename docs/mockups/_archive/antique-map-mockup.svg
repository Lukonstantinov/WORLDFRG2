    <rect x="0.5" y="-10" width="13" height="10" fill="#e9dcb8" stroke="#3c2c18"/><path d="M-1,-10 L7,-19.1 L15,-10 Z" fill="#9b3b2e" stroke="#3c2c18"/>
    <rect x="-5" y="-8" width="10" height="7" fill="#e9dcb8" stroke="#3c2c18"/><path d="M-6.5,-8 L0,-15 L6.5,-8 Z" fill="#9b3b2e" stroke="#3c2c18"/>
  </g>
  <g id="city">
