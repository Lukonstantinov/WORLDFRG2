[package]
name = "worldforge2"
version = "0.1.0"
edition = "2021"
description = "WorldForge 2 - Fantasy World Map Editor"

[lib]
name = "worldforge2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "worldforge2"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ── Keep the debug `target/` directory small ──────────────────────────────────
# A Tauri dev build's `target/` routinely balloons to 20-40 GB, almost all of it
# debug-symbol tables for the (many) dependencies. These two settings cut that by
# several times while keeping usable backtraces for our own code.
[profile.dev]
debug = "line-tables-only"        # backtraces, but drop the heavy full symbol tables
# The campaign tick is a numeric-hot simulation; at the default dev opt-level 0 it
# runs ~6× slower than optimized (≈1.3ms→0.23ms/tick at 160 hubs, far worse late
# campaign), which is the "campaign too slow" the user feels in `tauri dev`.
# opt-level 2 optimizes OUR crate's hot loops while keeping a fast incremental
# rebuild. `overflow-checks`/`debug-assertions` stay ON (dev defaults), so the
# year-30 index/overflow panic is still caught — we only make the math fast.
opt-level = 2

[profile.dev.package."*"]
debug = false                     # dependencies are rarely stepped into → no debuginfo
opt-level = 3                     # fully optimize deps (compiled once; rarely rebuilt)
