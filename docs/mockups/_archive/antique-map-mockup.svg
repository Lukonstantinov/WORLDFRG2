<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" font-family="'Times New Roman',Georgia,serif">
<defs>
  <radialGradient id="seal-iron" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#efe3c4"/><stop offset="1" stop-color="#9a8f7a"/></radialGradient>
  <radialGradient id="seal-grain" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#efe3c4"/><stop offset="1" stop-color="#c9b25a"/></radialGradient>
  <radialGradient id="seal-wine" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#efe3c4"/><stop offset="1" stop-color="#7a2438"/></radialGradient>
  <radialGradient id="seal-fish" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#efe3c4"/><stop offset="1" stop-color="#5d8aa0"/></radialGradient>
  <radialGradient id="seal-silk" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#efe3c4"/><stop offset="1" stop-color="#9a5688"/></radialGradient>
