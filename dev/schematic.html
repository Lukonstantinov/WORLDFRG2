<!doctype html>
<html><head><meta charset="utf-8"><title>WorldForge — panel schematics</title>
<style>
  html,body{margin:0;background:#0a1018;color:#cfe0f4;font:13px system-ui,sans-serif}
  .stage{position:relative;padding:16px 16px 40px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  .slot{position:relative;width:520px;min-height:640px}
  .cap{font:11px/1.4 system-ui;color:#6a86a6;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  /* Panels position themselves absolutely; anchor them inside their slot. */
  .slot > div[data-draggable]{position:absolute!important;top:0!important;left:0!important;right:auto!important}
</style></head>
<body><div id="root"></div><script type="module" src="./schematic.tsx"></script></body></html>
