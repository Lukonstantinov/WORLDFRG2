    <rect x="-26" y="-16" width="9" height="16" fill="#e9dcb8" stroke="#3c2c18"/><rect x="17" y="-16" width="9" height="16" fill="#e9dcb8" stroke="#3c2c18"/>
    <rect x="-14.5" y="-14" width="11" height="8" fill="#e9dcb8" stroke="#3c2c18"/><path d="M-16,-14 L-9,-21.7 L-2,-14 Z" fill="#9b3b2e" stroke="#3c2c18"/>
    <rect x="3.5" y="-14" width="11" height="8" fill="#e9dcb8" stroke="#3c2c18"/><path d="M2,-14 L9,-21.7 L16,-14 Z" fill="#9b3b2e" stroke="#3c2c18"/>
    <rect x="-6" y="-28" width="12" height="28" fill="#e9dcb8" stroke="#3c2c18"/>
    <rect x="-6" y="-30" width="3.6" height="2" fill="#3c2c18"/><rect x="-1.8" y="-30" width="3.6" height="2" fill="#3c2c18"/><rect x="2.4" y="-30" width="3.6" height="2" fill="#3c2c18"/>
    <line x1="0" y1="-30" x2="0" y2="-42" stroke="#3c2c18"/><path d="M0,-42 L9,-39.5 L0,-37 Z" fill="#9b3b2e"/>
    <rect x="-3" y="-7" width="6" height="7" fill="#3c2c18"/>
  </g>
</defs>

