    <path d="M25,17 a5,5 0 0 1 9,0" fill="none" stroke="#46563d" stroke-opacity="0.18" stroke-width="0.7"/>
  </pattern>
  <!-- ── town glyph templates (baseline at y=0, drawn upward) ── -->
  <g id="outpost"><rect x="-3.5" y="-12" width="7" height="12" fill="#e9dcb8" stroke="#3c2c18"/><rect x="-3.5" y="-14" width="2" height="2" fill="#3c2c18"/><rect x="-1" y="-14" width="2" height="2" fill="#3c2c18"/><rect x="1.5" y="-14" width="2" height="2" fill="#3c2c18"/></g>
  <g id="village"><rect x="-6" y="-9" width="12" height="9" fill="#e9dcb8" stroke="#3c2c18"/><path d="M-7.5,-9 L0,-17.4 L7.5,-9 Z" fill="#9b3b2e" stroke="#3c2c18"/></g>
  <g id="town">
